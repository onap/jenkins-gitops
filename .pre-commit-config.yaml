---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 ONAP Contributors

# Derived from lfreleng-actions/actions-template. Hooks for Python, Go and
# JavaScript are left out: this repository holds YAML, shell, Markdown and
# a Dockerfile.

ci:
  # pre-commit.ci commits are unsigned and cannot merge; fixes are applied
  # locally and committed signed.
  autofix_prs: false
  # pre-commit.ci sandbox prevents network calls; gha-workflow-linter and
  # aislop (dependency audits) cannot run there.
  skip:
    - gha-workflow-linter
    - aislop
  autoupdate_commit_msg: |
    Chore: Pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci@users.noreply.github.com>

# gitlint declares stages: [commit-msg]; without installing that hook
# type it never runs. Hooks that declare no stage would otherwise run
# again at commit-msg, so confine them to pre-commit.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # Guard the pins below before any of them run: a '# frozen:' label must
  # name a release, so an autoupdate onto a non-release tag is caught.
  - repo: local
    hooks:
      - id: frozen-rev-is-a-release
        name: frozen revs name a release
        language: pygrep
        # yamllint disable-line rule:line-length
        entry: '^[ \t]*rev:[ \t]*\S+[ \t]+#[ \t]*frozen:(?![ \t]+v?[0-9]+(\.[0-9]+)*(-[0-9]+)?[ \t]*$)'
        files: '^\.pre-commit-config\.yaml$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^base/jenkins/templates/.*
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=master
          - --branch=main
          - --branch=rc
          - --branch=production

  # Block credentials before they reach a commit. This repository's JCasC
  # files reference secrets as ${key}; a real value must never land here.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
        always_run: true

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]
        exclude: ^base/jenkins/templates/.*

  - repo: https://github.com/btford/write-good
    rev: ab66ce10136dfad5146e69e70f82a3efac8842c1  # frozen: v1.0.8
    hooks:
      - id: write-good
        files: "\\.(rst|md|markdown|mdown|mkdn)$"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # frozen: v6.2.0
    hooks:
      - id: reuse

  # Maintained fork of rhysd/actionlint; the -shellcheck variant brings its
  # own ShellCheck so 'run:' blocks are checked identically everywhere.
  - repo: https://github.com/kjanat/actionlint
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0  # frozen: v1.17.0
    hooks:
      - id: actionlint-shellcheck

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        # Generated from the live export; Maven settings carry project names.
        exclude: ^base/jenkins/jcasc/.*

  - repo: https://github.com/lfreleng-actions/gha-workflow-linter
    rev: 7bfe053dbc93ece6793014c594dfaf87c8712c47  # frozen: v1.8.3
    hooks:
      - id: gha-workflow-linter

  # Full-repository AI-slop quality gate, scored against .aislop/config.yml.
  - repo: local
    hooks:
      - id: aislop
        name: aislop
        entry: aislop ci --human
        language: node
        additional_dependencies: ["aislop@0.13.1"]
        pass_filenames: false
        always_run: true
