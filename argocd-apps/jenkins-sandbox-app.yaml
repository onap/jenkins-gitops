apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-sandbox
  namespace: argocd
spec:
  project: jenkins
  source:
    repoURL: https://github.com/onap/jenkins-gitops
    targetRevision: main
    path: base/jenkins
    helm:
      releaseName: jenkins
      valueFiles:
        - values.yaml
        - ../../sandbox/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins-sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
