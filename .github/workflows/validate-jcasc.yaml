# SPDX-FileCopyrightText: 2026 ONAP Contributors

# Builds the controller image and boots it with the JCasC files and dummy
# secrets (scripts/casc-smoke-test.sh). Proves the configuration is accepted
# by the exact plugin versions in the image.

name: Validate JCasC

"on":
  push:
    branches: [main]
    paths:
      - "build/**"
      - "base/jenkins/jcasc/**"
      - "base/jenkins/secret-keys.txt"
      - "local/values.yaml"
      - "scripts/casc-smoke-test.sh"
      - ".github/workflows/validate-jcasc.yaml"
  pull_request:
    branches: [main]
    paths:
      - "build/**"
      - "base/jenkins/jcasc/**"
      - "base/jenkins/secret-keys.txt"
      - "local/values.yaml"
      - "scripts/casc-smoke-test.sh"
      - ".github/workflows/validate-jcasc.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Boot Jenkins with JCasC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: build
          load: true
          tags: onap-jenkins:local
          cache-from: type=gha

      - name: Boot with JCasC and dummy secrets
        run: scripts/casc-smoke-test.sh onap-jenkins:local

      - name: Upload Jenkins log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jenkins-log
          path: casc-smoke-test.log
