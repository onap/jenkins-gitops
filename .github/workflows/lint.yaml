# SPDX-FileCopyrightText: 2026 ONAP Contributors

# Runs the repository's pre-commit hooks (yamllint, REUSE, whitespace) and a
# Zizmor audit of the workflows on every pull request and push to main.

name: Lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Run hooks
        env:
          # Guards local commits only; CI checks out main itself.
          SKIP: no-commit-to-branch
        run: uvx prek run --all-files --show-diff-on-failure

  zizmor:
    name: Zizmor workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Audit
        run: uvx zizmor --persona auditor --no-online-audits .github/workflows
