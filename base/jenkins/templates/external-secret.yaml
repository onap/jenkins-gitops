{{- /*
ExternalSecret that assembles the jenkins-jcasc-secrets Secret from the
secret store. One entry per key in secret-keys.txt, so the Secret always
matches what the JCasC files reference.

externalSecrets.remoteKeyFormat decides how a key maps to the store, e.g.
"onap-jenkins/%s" turns "buildlogs-password" into "onap-jenkins/buildlogs-password".
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-jcasc-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.jenkins.fullnameOverride }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: jcasc
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: jenkins-jcasc-secrets
    creationPolicy: Owner
  data:
  {{- range .Files.Lines "secret-keys.txt" }}
  {{- $key := trim . }}
  {{- if and $key (not (hasPrefix "#" $key)) }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf $.Values.externalSecrets.remoteKeyFormat $key | quote }}
  {{- end }}
  {{- end }}
  {{- range .Values.externalSecrets.extraKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf $.Values.externalSecrets.remoteKeyFormat . | quote }}
  {{- end }}
{{- end }}
