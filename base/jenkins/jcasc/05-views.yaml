# Generated from the JCasC export of jenkins.onap.org (Jenkins 2.462.3).
# Secret values are ${key} references resolved from the SECRETS directory.
# Views are also created by JJB (ci-management-views.yaml).
jenkins:
  views:
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      description: |-
        Empty job view. This is used as the default landing view to keep the Jenkins UI responding better while a) under high load and b) when there are a lot of jobs defined in the system
        <!-- Managed by Jenkins Job Builder -->
      name: 00-Empty View
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      - robot
      description: List of most recent jobs<!-- Managed by Jenkins Job Builder -->
      includeRegex: .*
      jobFilters:
      - mostRecentJobsFilter:
          checkStartTime: true
          maxToInclude: 25
      name: 01-Recent
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      description: |-
        <h1>List of Coverity Scan static code analysis jobs</h1> <p>See <a href="https://wiki.onap.org/x/Y6vQAw">how to add your component to Coverity Scan</a> on ONAP Developer Wiki.</p>
        <!-- Managed by Jenkins Job Builder -->
      includeRegex: .*-coverity
      name: All-Coverity
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      description: List of Sonar jobs<!-- Managed by Jenkins Job Builder -->
      includeRegex: ^(?=.*-sonar)(?!.*-no-sonar).*
      name: All-Sonar
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      - builtOnColumn
      includeRegex: .*-*
      jobFilters:
      - buildTrendFilter:
          amount: '180.0'
          amountTypeString: Days
          buildCountTypeString: All
          includeExcludeTypeString: excludeUnmatched
          statusTypeString: Failed
      name: All-failed (180 days)
  - list:
      columns:
      - status
      - weather
      - jobName
      - lastSuccess
      - lastFailure
      - lastDuration
      - buildButton
      - builtOnColumn
      includeRegex: .*-*
      jobFilters:
