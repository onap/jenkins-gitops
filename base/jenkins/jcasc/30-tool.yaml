              id: 3.6.3
    - name: mvn39
      properties:
      - installSource:
          installers:
          - maven:
              id: 3.9.9
  mavenGlobalConfig:
    globalSettingsProvider:
      mvn:
        settingsConfigId: global-settings
    settingsProvider: standard
  nodejs:
