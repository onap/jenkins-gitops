  maven:
    installations:
    - name: mvn38
      properties:
      - installSource:
          installers:
          - maven:
              id: 3.8.3
          - batchFile:
              command: "MAVEN_INSTALL_VER=3.8.3\r\nif [ ! -f /w/tools/hudson.tasks.Maven_MavenInstallation/apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz ]\r\nthen\r\n  cd /w\r\n  mkdir -p /w/tools/hudson.tasks.Maven_MavenInstallation\r\n  cd /w/tools/hudson.tasks.Maven_MavenInstallation/\r\n  wget https://nexus.opendaylight.org/content/repositories/hosted_installers/apache-maven/apache-maven/^${MAVEN_INSTALL_VER}/apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz\r\n  tar xfv apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz\r\n  for i in bin boot conf lib\r\n  do\r\n    ln -s ../apache-maven-^${MAVEN_INSTALL_VER}/^${i} mvn38/\r\n  done\r\nelse\r\n  echo \"Maven ^${MAVEN_INSTALL_VER} already installed\"\r\nfi"
              toolHome: /w/tools/hudson.tasks.Maven_MavenInstallation/apache-maven-3.8.3/
    - name: mvn33-new
      properties:
      - installSource:
          installers:
          - batchFile:
              command: "#!/bin/bash\r\n\r\n# variables\r\nMAVEN_INSTALL_VER=3.3.9\r\nMVNLOC=./mvn33\r\nINSTALL_PATH=/w/tools/hudson.tasks.Maven_MavenInstallation\r\n\r\nif [ ! -f ^${INSTALL_PATH}/apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz ]\r\nthen\r\n  cd /w\r\n  mkdir -p ^${INSTALL_PATH}\r\n  cd ^${INSTALL_PATH}\r\n  wget ^${NEXUSPROXY}/content/repositories/hosted_installers/apache-maven/apache-maven/^${MAVEN_INSTALL_VER}/apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz\r\n  tar xfv apache-maven-^${MAVEN_INSTALL_VER}-bin.tar.gz\r\n  for i in bin boot conf lib\r\n  do\r\n    ln -s ../apache-maven-^${MAVEN_INSTALL_VER}/^${i} ^${MVNLOC}\r\n  done\r\nelse\r\n  echo \"Maven ^${MAVEN_INSTALL_VER} already installed\"\r\nfi"
              toolHome: /w/tools/hudson.tasks.Maven_MavenInstallation/apache-maven-3.3.9/
    - name: mvn33
      properties:
      - installSource:
          installers:
          - maven:
              id: 3.3.9
    - name: mvn35
      properties:
      - installSource:
          installers:
          - maven:
              id: 3.5.4
    - name: mvn36
