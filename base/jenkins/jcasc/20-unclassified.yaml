        agentTraceCollectionPort: 8126
    emitConfigChangeEvents: false
    emitSecurityEvents: true
    emitSystemEvents: true
    enableCiVisibility: false
    refreshDogstatsdClient: false
    reportWith: DSD
    showDatadogLinks: true
    targetHost: localhost
    targetPort: 8125
    targetTraceCollectionPort: 8126
    traceServiceName: jenkins
    useAwsInstanceHostname: false
  defaultFolderConfiguration:
    healthMetrics:
    - worstChildHealthMetric:
        recursive: true
  email-ext:
    adminRequiredForTemplateTesting: false
    allowUnregisteredEnabled: false
    charset: UTF-8
    debugMode: false
    defaultBody: |-
      $PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS:

      Check console output at $BUILD_URL to view the results.
    defaultContentType: text/plain
    defaultRecipients: jenkins@lists.onap.org
    defaultSubject: '$PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS!'
    defaultTriggerIds:
