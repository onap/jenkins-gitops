        comment: ansible config file
        content: |
          [defaults]
          remote_tmp = ~/.ansible/tmp
        id: ansible-cfg
        name: ansible-cfg
    - custom:
        comment: Cloud auth credentials file
        content: |
          clouds:
            vex:
              auth:
                project_name: ef6e8825-fc3a-4ebf-886a-ba51ada06a9c
                username: "$CLOUDS_USR"
                password: "$CLOUDS_PSW"
                auth_url: 'https://auth.vexxhost.net/v3'
                user_domain_name: Default
                project_domain_name: Default
              region_name: ca-ymq-1
        customizedCredentialMappings:
        - credentialsId: cloud-credentials
          tokenKey: CLOUDS
        id: clouds-yaml
        name: clouds-yaml
    - globalMavenSettings:
        comment: Maven Global Settings file
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- vi: set et smarttab sw=2 tabstop=2: -->

          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">

            <mirrors>
              <mirror>
                <id>release-mirror</id>
                <name>Local Nexus mirror for builds</name>
                <url>^${env.NEXUSPROXY}/content/repositories/public/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>

            <profiles>
              <profile>
                <id>onap-settings</id>
                <properties>
                  <onap.nexus.url>https://nexus.onap.org</onap.nexus.url>
                  <onap.nexus.rawrepo.baseurl.upload>https://nexus.onap.org/content/sites/raw</onap.nexus.rawrepo.baseurl.upload>
                  <onap.nexus.rawrepo.baseurl.download>https://nexus.onap.org/service/local/repositories/raw/content</onap.nexus.rawrepo.baseurl.download>
                  <onap.nexus.rawrepo.serverid>ecomp-raw</onap.nexus.rawrepo.serverid>

                  <!-- properties for Nexus Docker registry -->
                  <onap.nexus.dockerregistry.daily>nexus3.onap.org:10003</onap.nexus.dockerregistry.daily>
                  <onap.nexus.dockerregistry.release>nexus3.onap.org:10002</onap.nexus.dockerregistry.release>
                  <docker.pull.registry>nexus3.onap.org:10001</docker.pull.registry>
                  <docker.push.registry>nexus3.onap.org:10003</docker.push.registry>
                </properties>
              </profile>
              <profile>
                <id>releases</id>
                <repositories>
                  <repository>
                    <id>releases</id>
                    <name>releases</name>
                    <url>^${env.NEXUSPROXY}/content/repositories/releases/</url>
                    <releases>
                      <enabled>true</enabled>
                      <updatePolicy>never</updatePolicy>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>

                <pluginRepositories>
                  <pluginRepository>
                    <id>releases</id>
                    <name>releases</name>
                    <url>^${env.NEXUSPROXY}/content/repositories/releases/</url>
                    <releases>
                      <enabled>true</enabled>
                      <updatePolicy>never</updatePolicy>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>

              <profile>
                <id>onap-public</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>http://repo1.maven.org/maven2/</url>
                  </repository>
                  <repository>
                    <id>onap-public</id>
                    <name>onap-public</name>
                    <url>https://nexus.onap.org/content/repositories/public/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>http://repo1.maven.org/maven2/</url>
                  </pluginRepository>
                  <pluginRepository>
                    <id>onap-public</id>
                    <name>onap-public</name>
                    <url>https://nexus.onap.org/content/repositories/public/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>

              <profile>
                <id>staging</id>
                <repositories>
                  <repository>
                    <id>staging</id>
                    <name>staging</name>
                    <url>^${env.NEXUSPROXY}/content/repositories/staging/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>

              <profile>
                <id>snapshots</id>
                <repositories>
                  <repository>
                    <id>snapshots</id>
                    <name>snapshots</name>
                    <url>^${env.NEXUSPROXY}/content/repositories/snapshots/</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>

                <pluginRepositories>
                  <pluginRepository>
                    <id>snapshots</id>
                    <name>snapshots</name>
                    <url>^${env.NEXUSPROXY}/content/repositories/snapshots/</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
              <profile>
                <id>local_m2</id>
                <repositories>
                  <repository>
                    <id>local_m2</id>
                    <name>local_m2</name>
                      <url>file:///tmp/r</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>onap-public</activeProfile>
              <activeProfile>onap-settings</activeProfile>
              <activeProfile>releases</activeProfile>
              <activeProfile>snapshots</activeProfile>
              <activeProfile>local_m2</activeProfile>
            </activeProfiles>
          </settings>
        id: global-settings
        isReplaceAll: true
        name: global-settings
    - openstackUserData:
        comment: CI management init
        content: |
          #!/bin/bash
          until host github.com &>/dev/null
          do
              echo "Waiting until github.com is resolvable..."
          done
          git clone https://github.com/lfit/releng-global-jjb.git /opt/ciman/global-jjb
          /opt/ciman/global-jjb/jenkins-init-scripts/init.sh

          IPADDR=$(facter ipaddress)
          HOSTNAME=$(facter hostname)
          FQDN=$(facter fqdn)

          echo "^${IPADDR} ^${HOSTNAME} ^${FQDN}" >> /etc/hosts
        id: jenkins-init-script
        name: jenkins-init-script
    - custom:
        comment: S3 log archives region
        content: |
          [default]
          region=us-east-1
        id: jenkins-s3-log-archives-region
        name: jenkins-s3-log-archives-region
    - custom:
        comment: S3 log archives credentials
        content: |
          [default]
          aws_access_key_id=Nothinghere
          aws_secret_access_key=Nothinghere
        id: jenkins-s3-log-archives-settings
        name: jenkins-s3-log-archives-settings
    - custom:
        comment: jenkins-s3-log-ship
        content: |
          [default]
          aws_access_key_id = NothingHere
          aws_secret_access_key = NothingHere
          region = us-west-2
        id: jenkins-s3-log-ship
        name: jenkins-s3-log-ship
    - custom:
        comment: JJB Config for Jenkins Job Builder
        content: |
          [job_builder]
          ignore_cache=True
          keep_descriptions=False
          include_path=.:scripts:~/git/
          recursive=True
          retain_anchors=True

          [jenkins]
          user=$JOBBUILDER_PROD_USR
          password=$JOBBUILDER_PROD_PSW
          url=https://jenkins.onap.org
          query_plugins_info=True

          [production]
          user=$JOBBUILDER_PROD_USR
          password=$JOBBUILDER_PROD_PSW
          url=https://jenkins.onap.org
          query_plugins_info=True

          [sandbox]
          user=$JOBBUILDER_SANDBOX_USR
          password=$JOBBUILDER_SANDBOX_PSW
          url=https://jenkins.onap.org/sandbox
          query_plugins_info=True
        customizedCredentialMappings:
        - credentialsId: jobbuilder-prod
          tokenKey: JOBBUILDER_PROD
        - credentialsId: jobbuilder-sandbox
          tokenKey: JOBBUILDER_SANDBOX
        id: jjbini
        name: JJB Config
    - custom:
        comment: LFTOOLS config file
        content: |
          [nexus.onap.org]
          username=$LFTOOLSINI_NEXUS_USR
          password=$LFTOOLSINI_NEXUS_PSW
          [nexus]
          user=$JENKINS_RELEASE_USR
          password=$JENKINS_RELEASE_PSW
          [rtd]
          endpoint=https://readthedocs.org/api/v3/
          token=$RTD_TOKEN
        customizedCredentialMappings:
        - credentialsId: lftoolsini
          tokenKey: JENKINS_RELEASE
        - credentialsId: lftoolsini-nexus
          tokenKey: LFTOOLSINI_NEXUS
        - credentialsId: rtd-token
          tokenKey: RTD_TOKEN
        id: lftoolsini
        name: lftoolsini
