#
# Generated from the JCasC export of jenkins.onap.org (Jenkins 2.462.3).
# Secret values are ${key} references resolved from the SECRETS directory.
# Login (SAML) and permissions. Environments without SAML exclude this file
# (jcasc.excludeFiles) and supply their own.
jenkins:
  securityRealm:
    saml:
      binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
      displayNameAttributeName: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
      emailAttributeName: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
      groupsAttributeName: http://schemas.xmlsoap.org/claims/Group
      idpMetadataConfiguration:
        period: 0
        xml: <EntityDescriptor entityID="urn:sso.linuxfoundation.org" xmlns="urn:oasis:names:tc:SAML:2.0:metadata"> <IDPSSODescriptor protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol"> <KeyDescriptor use="signing"> <KeyInfo xmlns="http://www.w3.org/2000/09/xmldsig#"> <X509Data> <X509Certificate></X509Certificate> </X509Data> </KeyInfo> </KeyDescriptor> <SingleLogoutService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="https://sso.linuxfoundation.org/samlp/ICfgq3rh1oIfnEvv9d9w06m1qswvyILH/logout"/> <SingleLogoutService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST" Location="https://sso.linuxfoundation.org/samlp/ICfgq3rh1oIfnEvv9d9w06m1qswvyILH/logout"/> <NameIDFormat>urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress</NameIDFormat> <NameIDFormat>urn:oasis:names:tc:SAML:2.0:nameid-format:persistent</NameIDFormat> <NameIDFormat>urn:oasis:names:tc:SAML:2.0:nameid-format:transient</NameIDFormat> <SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="https://sso.linuxfoundation.org/samlp/ICfgq3rh1oIfnEvv9d9w06m1qswvyILH"/> <SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST" Location="https://sso.linuxfoundation.org/samlp/ICfgq3rh1oIfnEvv9d9w06m1qswvyILH"/> <Attribute Name="http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress" NameFormat="urn:oasis:names:tc:SAML:2.0:attrname-format:uri" FriendlyName="E-Mail Address" xmlns="urn:oasis:names:tc:SAML:2.0:assertion"/> <Attribute Name="http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname" NameFormat="urn:oasis:names:tc:SAML:2.0:attrname-format:uri" FriendlyName="Given Name" xmlns="urn:oasis:names:tc:SAML:2.0:assertion"/> <Attribute Name="http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name" NameFormat="urn:oasis:names:tc:SAML:2.0:attrname-format:uri" FriendlyName="Name" xmlns="urn:oasis:names:tc:SAML:2.0:assertion"/> <Attribute Name="http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname" NameFormat="urn:oasis:names:tc:SAML:2.0:attrname-format:uri" FriendlyName="Surname" xmlns="urn:oasis:names:tc:SAML:2.0:assertion"/> <Attribute Name="http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier" NameFormat="urn:oasis:names:tc:SAML:2.0:attrname-format:uri" FriendlyName="Name ID" xmlns="urn:oasis:names:tc:SAML:2.0:assertion"/> </IDPSSODescriptor> </EntityDescriptor>
      maximumAuthenticationLifetime: 7200
      usernameAttributeName: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier
      usernameCaseConversion: none
  authorizationStrategy:
    globalMatrix:
      entries:
      - userOrGroup:
          name: anonymous
          permissions:
          - Job/Discover
          - Job/ExtendedRead
          - Job/Read
          - Overall/Read
          - View/Read
      - userOrGroup:
          name: ecomp-jenkinsadmin
          permissions:
          - Overall/Administer
      - userOrGroup:
          name: lf-releng
          permissions:
          - Overall/Administer
      - userOrGroup:
          name: lf-sysops
          permissions:
          - Overall/Administer
      - userOrGroup:
          name: onap-build-failure-analyzer-access
          permissions:
          - Build Failure Analyzer/UpdateCauses
          - Build Failure Analyzer/ViewCauses
      - userOrGroup:
          name: onap-gerrit-doc-committers
          permissions:
          - Gerrit/ManualTrigger
          - Gerrit/Retrigger
          - Job/Build
          - Job/Cancel
      - userOrGroup:
          name: onap-gerrit-integration-committer
          permissions:
          - Gerrit/ManualTrigger
          - Gerrit/Retrigger
          - Job/Build
          - Job/Cancel
          - Overall/Read
      - userOrGroup:
          name: onap-gerrit-sdc-committers
          permissions:
          - Job/Cancel
      - userOrGroup:
          name: onap-jenkins-labs
          permissions:
          - Gerrit/ManualTrigger
          - Gerrit/Retrigger
          - Job/Build
          - Job/Cancel
      - userOrGroup:
          name: onap-jobbuilder
          permissions:
          - Job/Configure
          - Job/Create
          - Job/Delete
          - Job/Discover
          - Job/Read
          - Overall/Administer
          - Overall/Read
          - View/Configure
          - View/Create
          - View/Delete
          - View/Read
